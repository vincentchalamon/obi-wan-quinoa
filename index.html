<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F4A36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Obi-Wan Quinoa</title>
<style>
  :root{
    --vert-fonce:#2F4A36;--vert-feuille:#6E9E5E;--vert-clair:#E7EEE0;
    --betterave:#A8455E;--betterave-clair:#F4E3E7;
    --encre:#25342A;--ardoise:#6B7468;--papier:#F4F6EF;--carte:#FFFFFF;--trait:#E2E7DA;
    --ombre:0 1px 3px rgba(37,52,42,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--papier);color:var(--encre);
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:15px;line-height:1.55;}
  h2,h3{font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;color:var(--vert-fonce);margin:0;}

  /* ---------- Header (sobre, slim) ---------- */
  .app-header{position:sticky;top:0;z-index:20;background:var(--vert-fonce);color:#fff;
    padding:max(9px,env(safe-area-inset-top)) 16px 10px;box-shadow:var(--ombre);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}  /* 7 touchers : ni sélection, ni loupe */
  #owq-brand{flex:1 1 auto;}   /* absorbe l'espace : les pastilles restent à droite (3 enfants flex) */
  .app-header .brand{font-family:Georgia,serif;font-size:17px;font-weight:700;line-height:1.1;letter-spacing:.01em;}
  .app-header .slogan{font-size:11.5px;opacity:.82;margin-top:2px;font-style:italic;}
  .app-settings-btn{flex:0 0 auto;border:none;background:rgba(255,255,255,.14);color:#fff;
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .app-settings-btn svg{width:20px;height:20px;}
  .app-settings-btn:active{background:rgba(255,255,255,.28);}
  .app-settings-btn[hidden]{display:none;}   /* display:flex ci-dessus écrase le [hidden] de l'UA */

  /* ---------- Navigation (desktop inline / mobile hamburger) ---------- */
  #owq-hamburger{display:none;}
  .app-nav{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .nav-link{border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .nav-link:active{background:rgba(255,255,255,.28);}
  .nav-link.is-active{background:#fff;color:var(--vert-fonce);}
  @media (max-width:899px){
    #owq-hamburger{display:flex;}
    .app-nav{position:absolute;top:100%;left:8px;flex-direction:column;align-items:stretch;gap:4px;   /* aligné à gauche (comme le hamburger) */
      background:var(--carte);border:1px solid var(--trait);border-radius:12px;box-shadow:0 8px 24px rgba(37,52,42,.18);
      padding:8px;min-width:200px;display:none;z-index:40;}
    .app-header.nav-open .app-nav{display:flex;}
    .app-nav .nav-link{background:transparent;color:var(--encre);text-align:left;border-radius:8px;padding:10px 12px;font-size:14px;}
    .app-nav .nav-link.is-active{background:var(--vert-clair);color:var(--vert-fonce);}
    .app-nav .app-settings-btn{width:auto;height:auto;border-radius:8px;justify-content:flex-start;gap:8px;padding:10px 12px;background:transparent;color:var(--encre);}   /* icône + libellé visibles sur fond blanc */
    .app-nav .app-settings-btn svg{width:20px;height:20px;flex:0 0 auto;}
    .app-nav .app-settings-btn::after{content:attr(data-label);font-size:14px;font-weight:600;color:var(--encre);}
  }
  /* Voile derrière le menu ouvert (mobile) : clic dehors = fermer ; désactive les liens du contenu. */
  .nav-backdrop{position:fixed;left:0;right:0;top:var(--head-h,56px);bottom:0;z-index:15;background:rgba(37,52,42,.10);}
  .nav-backdrop[hidden]{display:none;}
  @media (min-width:900px){ .nav-backdrop{display:none !important;} }

  /* ---------- Catalogue (écran principal) ---------- */
  #catalogue{max-width:720px;margin:0 auto;padding:10px 16px calc(48px + env(safe-area-inset-bottom));}
  #catalogue[hidden],#planning[hidden]{display:none;}
  .cat-filters{margin:4px 0 14px;}
  .cat-filters select,.cat-allerg>summary,#cat-search{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--trait);border-radius:9px;background:var(--carte);color:var(--encre);-webkit-appearance:none;}
  .cat-search-wrap{position:relative;width:100%;margin-bottom:8px;}
  #cat-search{width:100%;padding-right:34px;}
  #cat-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--ardoise);font-size:22px;line-height:1;cursor:pointer;padding:2px 8px;}
  #cat-clear[hidden]{display:none;}
  .cat-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .cat-row select{flex:1 1 auto;min-width:0;}
  .cat-allerg{position:relative;flex:1 1 auto;}
  .cat-allerg>summary{list-style:none;cursor:pointer;white-space:nowrap;display:block;}
  .cat-allerg>summary::-webkit-details-marker{display:none;}
  .cat-allerg[open]>summary{border-color:var(--vert-feuille);}
  .cat-allerg .opts{position:absolute;z-index:35;margin-top:4px;background:var(--carte);border:1px solid var(--trait);
    border-radius:10px;box-shadow:0 8px 24px rgba(37,52,42,.18);padding:8px;display:flex;flex-wrap:wrap;gap:6px;min-width:min(280px,80vw);}
  .alg-chip{border:1px solid var(--trait);background:var(--carte);color:var(--ardoise);border-radius:20px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;}
  .alg-chip.on{background:var(--betterave);border-color:var(--betterave);color:#fff;}
  .cat-count{color:var(--ardoise);font-size:12.5px;margin:0 2px 10px;}
  .cat-card{display:flex;gap:12px;align-items:center;background:var(--carte);border:1px solid var(--trait);border-radius:12px;box-shadow:var(--ombre);padding:10px 12px;margin-bottom:10px;cursor:pointer;}
  .cat-card:active{background:var(--vert-clair);}
  .cat-card img{width:56px;height:56px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--vert-clair);}
  .cat-card .cat-body{flex:1 1 auto;min-width:0;}
  .cat-card .cat-titre{font-size:15px;color:var(--encre);line-height:1.3;}
  .cat-card .cat-meta{font-size:12px;color:var(--ardoise);margin-top:3px;}
  .cat-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--vert-feuille);border:1px solid var(--vert-feuille);border-radius:20px;padding:1px 7px;margin-right:4px;}
  .cat-tag.t-repas{color:#2F4A36;border-color:#2F4A36;}            /* vert foncé */
  .cat-tag.t-dessert{color:#A8455E;border-color:#A8455E;}          /* betterave */
  .cat-tag.t-accompagnement{color:#C9912F;border-color:#C9912F;}   /* ambre */
  .cat-tag.t-base{color:#3B7D8C;border-color:#3B7D8C;}             /* bleu-vert */
  .cat-empty{color:var(--ardoise);text-align:center;margin:32px 8px;}
  .allerg{color:var(--betterave);font-size:12.5px;margin:0 0 14px;}

  /* ---------- Planning ---------- */
  #planning{max-width:720px;margin:0 auto;padding:6px 16px calc(48px + env(safe-area-inset-bottom));}

  /* Marqueur de semaine — sobre, NON fixe, avant chaque début de semaine (actions Préparer/Courses) */
  .week-marker{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin:28px 2px 14px;padding:0 2px 8px;border-bottom:1px solid var(--trait);scroll-margin-top:70px;}
  .week-marker:first-child{margin-top:10px;}
  .wm-name{font-family:Georgia,serif;font-size:15px;color:var(--vert-fonce);font-weight:700;}
  .courses-btn,.prep-btn{border:1px solid var(--vert-feuille);background:transparent;color:var(--vert-fonce);
    border-radius:20px;padding:5px 12px 5px 9px;font:inherit;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;}
  .courses-btn svg,.prep-btn svg{width:15px;height:15px;stroke:var(--vert-feuille);fill:none;stroke-width:1.7;}
  .courses-btn:active,.prep-btn:active{background:var(--vert-clair);}
  .wm-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;}

  .day-card{background:var(--carte);border:1px solid var(--trait);border-radius:12px;
    box-shadow:var(--ombre);margin-bottom:12px;overflow:hidden;scroll-margin-top:70px;}
  .day-card.passe{opacity:.5;}
  .day-card.today{border-color:var(--vert-feuille);box-shadow:0 0 0 1px var(--vert-feuille),var(--ombre);}
  .day-h{font-size:16px;padding:12px 15px 10px;display:flex;align-items:center;flex-wrap:wrap;gap:7px;border-bottom:1px solid var(--trait);}

  .repas-row{width:100%;display:grid;grid-template-columns:15px 46px 1fr auto;align-items:center;gap:10px;
    padding:11px 14px;min-height:60px;border-left:4px solid var(--vert-feuille);cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  .repas-row + .repas-row{border-top:1px solid var(--trait);}
  .repas-row.soir{border-left-color:var(--betterave);}
  .repas-main:active{opacity:.6;}
  .repas-row-moment{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--vert-feuille);}
  .repas-row.soir .repas-row-moment{color:var(--betterave);}
  .repas-row-titre{font-size:14.5px;line-height:1.35;color:var(--encre);}
  .repas-row-meta{font-size:12px;color:var(--ardoise);margin-top:2px;display:block;}
  .frais-pill{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--vert-feuille);border:1px solid var(--vert-feuille);border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:1px;}
  .row-action{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--trait);background:#fff;
    color:var(--ardoise);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .row-action:active{background:#F0F2EC;}
  .repas-row.supprime{opacity:.5;}
  .repas-row.supprime .repas-row-titre{text-decoration:line-through;}
  .repas-row.supprime .row-action{color:var(--vert-feuille);border-color:var(--vert-feuille);}
  .repas-vide{padding:16px 15px;color:var(--ardoise);font-size:13.5px;font-style:italic;}
  .repas-row.slot{cursor:pointer;min-height:48px;}
  .repas-row.slot .slot-empty{color:var(--vert-feuille);font-weight:600;font-size:13.5px;}
  .repas-row.slot.soir .slot-empty{color:var(--betterave);}
  .repas-row.slot:active{background:var(--vert-clair);}

  /* Drag'n'drop : glisser depuis la poignée (icône) */
  .repas-grip{display:inline-flex;align-items:center;justify-content:center;border:none;background:none;padding:0;color:var(--ardoise);opacity:.3;cursor:grab;touch-action:none;}
  .repas-grip svg{width:15px;height:15px;}
  .repas-row.dragging{opacity:.35;}
  .repas-row.drop-target{background:var(--vert-clair);box-shadow:inset 0 0 0 2px var(--vert-feuille);}
  body.dragging-active{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grabbing;}
  .drag-ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--carte);
    border:1px solid var(--vert-feuille);border-radius:10px;box-shadow:0 6px 20px rgba(37,52,42,.25);
    padding:8px 12px;font-size:14px;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- Overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:50;background:var(--papier);display:flex;flex-direction:column;}
  #overlay[hidden]{display:none;}
  .ov-head{position:sticky;top:0;background:var(--carte);border-bottom:1px solid var(--trait);
    display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;min-height:54px;}
  .ov-back{border:none;background:none;padding:6px;margin:-6px 0 -6px -6px;color:var(--vert-fonce);cursor:pointer;display:flex;}
  .ov-back svg{width:24px;height:24px;}
  .ov-title{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--vert-fonce);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ov-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;width:100%;}

  .recipe{background:var(--carte);border:1px solid var(--trait);border-radius:12px;box-shadow:var(--ombre);padding:20px 18px 22px;}
  .recipe-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--vert-feuille);border:1px solid var(--vert-feuille);border-radius:20px;padding:3px 11px;margin-bottom:12px;}
  .recipe-tag.soir{color:var(--betterave);border-color:var(--betterave);}
  .recipe-titre{font-size:22px;line-height:1.2;margin-bottom:14px;}
  .recipe-img{width:100%;border-radius:10px;margin:0 0 16px;display:block;object-fit:cover;max-height:280px;}
  .recipe-src{margin:14px 0 0;font-size:13px;}
  .recipe-src a{color:var(--vert-feuille);}
  .macros{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;font-variant-numeric:tabular-nums;}
  .chip.kcal{background:var(--vert-clair);color:var(--vert-fonce);}
  .chip.prot{background:var(--betterave-clair);color:var(--betterave);}
  .chip.frais{background:#fff;color:var(--vert-feuille);border:1px solid var(--vert-feuille);}
  .recipe h3{font-family:"Helvetica Neue",sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ardoise);font-weight:700;margin:0 0 10px;}
  .recipe .bloc{margin-bottom:22px;}
  ul.ingr{list-style:none;margin:0;padding:0;}
  ul.ingr li{position:relative;padding:7px 0 7px 18px;border-bottom:1px dotted var(--trait);font-size:14px;}
  ul.ingr li:last-child{border-bottom:none;}
  ul.ingr li::before{content:"";position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--vert-feuille);}
  .recipe.soir ul.ingr li::before{background:var(--betterave);}
  ol.etapes{list-style:none;margin:0;padding:0;counter-reset:step;}
  ol.etapes li{position:relative;padding:0 0 13px 34px;font-size:14px;}
  ol.etapes li:last-child{padding-bottom:0;}
  ol.etapes li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;
    background:var(--vert-fonce);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .recipe.soir ol.etapes li::before{background:var(--betterave);}
  .del-btn{margin-top:6px;width:100%;padding:13px;border-radius:10px;border:1px solid var(--trait);background:#fff;
    color:var(--betterave);font:inherit;font-weight:600;cursor:pointer;}
  .del-btn.is-del{color:var(--vert-fonce);border-color:var(--vert-feuille);background:var(--vert-clair);}
  /* Barre d'actions recette (icônes) : mode cuisine */
  .recipe-actions{display:flex;gap:8px;margin:0 0 22px;}
  .act-btn{flex:1 1 0;height:46px;border:1px solid var(--trait);background:#fff;border-radius:10px;
    color:var(--vert-fonce);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .act-btn svg{width:22px;height:22px;}
  .act-btn:active{background:var(--vert-clair);}
  .act-btn.is-on{background:var(--vert-feuille);border-color:var(--vert-feuille);color:#fff;}

  .hint{color:var(--ardoise);font-size:13px;margin:0 0 16px;}
  .rayon{background:var(--carte);border:1px solid var(--trait);border-radius:12px;box-shadow:var(--ombre);padding:6px 16px 8px;margin-bottom:14px;}
  .rayon h2{font-size:16px;display:flex;align-items:center;gap:9px;padding:11px 0 9px;border-bottom:2px solid var(--vert-clair);margin-bottom:2px;}
  .rayon h2 .pip{width:11px;height:11px;border-radius:3px;background:var(--vert-feuille);}
  .rayon.r-prot h2 .pip{background:var(--betterave);}
  .rayon.r-epi h2 .pip{background:#C9912F;}
  .rayon.r-fru h2 .pip{background:#D26A3B;}
  .rayon.r-con h2 .pip{background:#8A8F82;}
  .rayon.r-aut h2 .pip{background:#B0A48F;}
  .rayon ul{list-style:none;margin:0;padding:0;}
  .course-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dotted var(--trait);cursor:pointer;font-size:14px;min-height:46px;}
  .course-item:last-child{border-bottom:none;}
  .course-item .check{flex:0 0 auto;width:21px;height:21px;border:2px solid var(--vert-feuille);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .12s;}
  .course-item .check svg{width:13px;height:13px;opacity:0;}
  .course-nom{flex:1 1 auto;}
  .course-q{color:var(--ardoise);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
  button.course-q.edit{border:none;background:none;font:inherit;cursor:pointer;padding:4px 6px;margin:-4px -6px;border-radius:7px;line-height:1.2;}
  button.course-q.edit:active{background:var(--vert-clair);}
  .course-q .q-need{display:block;font-size:10.5px;opacity:.7;}
  .q-edit{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .q-edit input{width:66px;font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--vert-feuille);border-radius:7px;text-align:right;-webkit-appearance:none;}
  .q-unit{font-size:12px;color:var(--ardoise);}
  .course-item.done .check{background:var(--vert-feuille);}
  .course-item.done .check svg{opacity:1;}
  .course-item.done .course-nom{text-decoration:line-through;color:var(--ardoise);}
  .course-item.done{opacity:.45;}   /* atténuer les articles cochés pour faire ressortir le reste */
  .course-item.exclu{opacity:.5;cursor:default;}   /* article d'un repas exclu : visible mais grisé, non compté */
  .course-item.exclu .course-nom{text-decoration:line-through;color:var(--ardoise);}
  .course-item.exclu .check{border-color:var(--trait);background:transparent;}
  .course-item.exclu .course-q{color:var(--ardoise);}

  /* Bouton flottant : revenir à aujourd’hui */
  #today-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;
    width:46px;height:46px;border-radius:50%;border:none;background:var(--vert-fonce);color:#fff;
    box-shadow:0 2px 8px rgba(37,52,42,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  #today-fab svg{width:22px;height:22px;}
  #today-fab:active{background:var(--vert-feuille);}

  /* ---------- Écran « Préparer » + formulaires ---------- */
  .prep-note{color:var(--ardoise);font-size:13px;margin:0 0 16px;}
  .prep-week{font-weight:700;color:var(--vert-fonce);}
  .field{margin-bottom:16px;}
  .field > label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ardoise);margin-bottom:6px;}
  .field textarea,.field select{width:100%;font:inherit;font-size:15px;color:var(--encre);background:var(--carte);
    border:1px solid var(--trait);border-radius:10px;padding:10px 12px;-webkit-appearance:none;}
  .field textarea{min-height:96px;resize:vertical;line-height:1.5;}
  .field .row{display:flex;align-items:center;gap:8px;}
  .field .row input[type=checkbox]{width:18px;height:18px;}
  .field .row label{margin:0;text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;color:var(--encre);}
  .btn-primary{width:100%;padding:14px;border-radius:10px;border:none;background:var(--vert-fonce);color:#fff;
    font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px;}
  .btn-primary:active{background:var(--vert-feuille);}
  .btn-secondary{width:100%;padding:12px;border-radius:10px;border:1px solid var(--trait);background:#fff;
    color:var(--vert-fonce);font:inherit;font-weight:600;cursor:pointer;margin-top:10px;}
  .btn-secondary:active{background:var(--vert-clair);}
  .prep-ok{color:var(--vert-feuille);font-size:13px;text-align:center;margin-top:10px;min-height:18px;}
  /* Génération de menu (proposition) */
  .src-note{color:var(--ardoise);font-size:12.5px;margin:-8px 0 16px;}
  .src-note a{color:var(--vert-feuille);}
  .gen-day{background:var(--carte);border:1px solid var(--trait);border-radius:12px;box-shadow:var(--ombre);margin-bottom:12px;overflow:hidden;}
  .gen-day-h{font-size:16px;padding:12px 15px 10px;color:var(--vert-fonce);font-weight:700;border-bottom:1px solid var(--trait);}
  .gen-repas{display:flex;align-items:center;gap:10px;padding:11px 12px;min-height:56px;border-left:4px solid var(--vert-feuille);}
  .gen-repas + .gen-repas{border-top:1px solid var(--trait);}
  .gen-repas.soir{border-left-color:var(--betterave);}
  .gen-moment{flex:0 0 auto;width:36px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--vert-feuille);}
  .gen-moment.soir{color:var(--betterave);}
  .gen-titre{flex:1 1 auto;color:var(--encre);text-decoration:none;font-size:14px;}
  .gen-titre:active{opacity:.6;}
  .gen-reroll,.gen-del{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--trait);background:#fff;color:var(--vert-fonce);font-size:15px;line-height:1;cursor:pointer;}
  .gen-reroll:active,.gen-del:active{background:var(--vert-clair);}
  .gen-reroll svg{width:16px;height:16px;}
  .gen-handle{flex:0 0 auto;border:none;background:none;padding:0;color:var(--ardoise);opacity:.35;cursor:grab;touch-action:none;display:inline-flex;align-items:center;}
  .gen-handle svg{width:16px;height:16px;}
  .gen-repas.supprime{opacity:.55;}
  .gen-repas.supprime .gen-titre{text-decoration:line-through;color:var(--ardoise);pointer-events:none;}
  .gen-repas.dragging{opacity:.4;}
  .gen-repas.drop-target{background:var(--vert-clair);box-shadow:inset 0 0 0 2px var(--vert-feuille);border-radius:6px;}
  .day-total{padding:8px 15px;font-size:12px;color:var(--ardoise);border-top:1px solid var(--trait);background:#FBFCF9;font-variant-numeric:tabular-nums;}
  /* Couverts (vue recette) */
  .couverts{display:flex;align-items:center;gap:10px;margin:0 0 20px;flex-wrap:wrap;}
  .couverts .cv-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ardoise);}
  .cv-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--trait);background:#fff;color:var(--vert-fonce);
    font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cv-btn:active{background:var(--vert-clair);}
  .cv-val{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;}
  .cv-hint{font-size:12px;color:var(--ardoise);flex:1 1 100%;}
  #owq-status{background:var(--betterave-clair);color:var(--betterave);font-size:12.5px;text-align:center;padding:8px 14px;}
  #owq-status.ok{background:var(--vert-clair);color:var(--vert-fonce);}
  #owq-status[hidden]{display:none;}

  /* ---------- Desktop : deux volets (planning à gauche, détail ancré à droite) ---------- */
  .ov-placeholder{color:var(--ardoise);font-size:14px;text-align:center;margin:48px 8px 0;line-height:1.6;}
  @media (min-width:900px){
    :root{--panel-w:min(42vw,620px);}
    #planning,#catalogue{max-width:720px;margin:0;margin-right:var(--panel-w);padding-left:24px;}
    #overlay{position:fixed;inset:var(--head-h,56px) 0 0 auto;width:var(--panel-w);
      border-left:1px solid var(--trait);box-shadow:-2px 0 12px rgba(37,52,42,.05);}
    #overlay[hidden]{display:flex;}            /* panneau toujours visible sur desktop */
    .ov-body{max-width:none;}
    #today-fab{right:auto;left:16px;}          /* hors du panneau de droite */
  }
</style>
</head>

<header class="app-header">

  </nav>
</header>
<div id="owq-status" hidden></div>

<main id="catalogue"></main>
<main id="planning" hidden></main>

  <header class="ov-head">
    <button class="ov-back" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="ov-title"></span>
  </header>
  <div class="ov-body"></div>
</div>

<button id="today-fab" aria-label="Revenir à aujourd’hui" title="Aujourd’hui"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>

<script src="logic.js"></script>
<script src="catalogue.js"></script>
<script>
/* ============================================================
   OBI-WAN QUINOA
   Semaine alimentaire à début configurable (profil : weekStart, défaut jeudi = rythme AMAP).
   - Marqueur "Semaine du <début>" avant chaque début de semaine, avec les actions Préparer & Courses.
   - Menu et courses indexés par le premier jour de la semaine (wid = idOf(startOfWeek(d, weekStart))).
   - La liste de courses est CALCULÉE à partir des repas non supprimés, x couverts par repas.
   Données 100 % locales : catalogue embarqué dans le dépôt (recipes/, voir catalogue.js) ; menus générés
   stockés en localStorage (owq.recipes / owq.gen) et matérialisés au boot.
   ============================================================ */

/* champ shop : {n:nom, q:quantité|null, u:unité, r:rayon, note?}
   r ∈ prot|leg|epi|con|fru   ·   q=null => pas de cumul (condiment, à l'unité) */
/* Catalogue : recettes sélectionnées, en cache localStorage (voir rebuild()). */
let R = {};

/* midi/soir/resolveRepas/materializeMenus : voir logic.js (materializeMenus(raw, R)). */

/* Régimes proposés dans le profil (valeur = label de régime, filtre le pool de génération) */
const DIETS=[["","Aucun"],["vegetarien","Végétarien"],["vegan","Vegan"]];

let RAW_MENUS = {}; /* menus générés bruts (avant matérialisation), clé = début de semaine ; base des overrides */
let MENUS = {};   /* menus matérialisés (recettes résolues) */

/* Empreinte d'une semaine pour invalider qty/overrides : le genId (stable aux éditions incrémentales
   « au fil de l'eau », changé seulement à la génération pleine semaine). Repli : hash des jours. */
function weekFp(w){ return w ? (w.genId || JSON.stringify(w.jours)) : 'none'; }
function newGenId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ============================ Dates ============================ */
/* MOIS/JOURS/pad/idOf/parseId/addDays/startOfWeek/fmt : voir logic.js. */
const today=(function(){const t=new Date();t.setHours(0,0,0,0);return t;})();

/* ============================ Persistance ============================ */
const store={mem:{},
  get(k){try{return localStorage.getItem(k);}catch(e){return (k in this.mem)?this.mem[k]:null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){this.mem[k]=v;}}};
function loadSet(k){const raw=store.get(k);if(!raw)return new Set();try{return new Set(JSON.parse(raw));}catch(e){return new Set();}}
function saveSet(k,s){store.set(k,JSON.stringify(Array.from(s)));}
const deleted=loadSet('owq.deleted');   // clés "wid:di-ri"
const coches=loadSet('owq.checked');    // clés "wid§rayon§nom"

/* ---- Profil utilisateur (régime, couverts par défaut, début de semaine) ---- */
function loadProfile(){ let p={}; const raw=store.get('owq.profile'); if(raw){ try{ p=JSON.parse(raw)||{}; }catch(e){ p={}; } }
  return { diet: p.diet||'', couverts: (p.couverts>=1?p.couverts:1), weekStart: (p.weekStart>=0&&p.weekStart<=6?p.weekStart:4) }; } /* défaut jeudi : rythme AMAP de l'auteur (modifiable dans le profil) */
function saveProfile(p){ store.set('owq.profile', JSON.stringify(p)); }
let profile=loadProfile();
function sow(d){ return startOfWeek(d, profile.weekStart); }   // début de semaine selon le profil

/* ---- Couverts par repas (override du défaut profil), clé "wid:di-ri" ---- */
function loadCouverts(){ const raw=store.get('owq.couverts'); if(!raw) return {}; try{ return JSON.parse(raw)||{}; }catch(e){ return {}; } }
let couvertsMap=loadCouverts();
function couvertsGet(wid,di,ri){ const k=wid+':'+di+'-'+ri; return (k in couvertsMap)?couvertsMap[k]:profile.couverts; }
function couvertsSet(wid,di,ri,val){ const k=wid+':'+di+'-'+ri; val=Math.max(1,Math.round(val||1));
  if(val===profile.couverts) delete couvertsMap[k]; else couvertsMap[k]=val;
  store.set('owq.couverts', JSON.stringify(couvertsMap)); }

/* ---- Catalogue sélectionné + menus générés (persistés localStorage, dispo hors-ligne) ---- */
function loadRecipesCache(){ const raw=store.get('owq.recipes'); if(!raw) return {}; try{ return JSON.parse(raw)||{}; }catch(e){ return {}; } }
function saveRecipesCache(o){ store.set('owq.recipes', JSON.stringify(o)); }
function loadGenMenus(){ const raw=store.get('owq.gen'); if(!raw) return {}; try{ return JSON.parse(raw)||{}; }catch(e){ return {}; } }
function saveGenMenus(o){ store.set('owq.gen', JSON.stringify(o)); }
/* Reconstruit le catalogue et les menus depuis le cache local (recettes sélectionnées + menus générés). */
function rebuild(){ R=loadRecipesCache();
  RAW_MENUS=loadGenMenus();
  MENUS=materializeMenus(applyOverrides(RAW_MENUS), R); }

/* ============================ Overrides de menu (édition à la volée) ============================ */
function loadOverrides(){ const raw=store.get('owq.menu'); if(!raw) return {}; try{ return JSON.parse(raw)||{}; }catch(e){ return {}; } }
function saveOverrides(o){ store.set('owq.menu', JSON.stringify(o)); }
/* Applique les overrides valides sur le brut ; purge ceux dont la source a changé (régénération du menu). */
function applyOverrides(raw){
  const ov=loadOverrides(); let changed=false; const eff={};
  Object.keys(raw).forEach(function(w){ eff[w]=raw[w]; });
  Object.keys(ov).forEach(function(w){
    if(raw[w] && ov[w].base===weekFp(raw[w])){ eff[w]={jours:ov[w].jours}; }
    else { delete ov[w]; changed=true; }
  });
  if(changed) saveOverrides(ov);
  return eff;
}

/* ============================ Liste de courses calculée ============================ */
const RAYONS=[["prot","Protéines & laitages"],["leg","Légumes"],["epi","Épicerie & féculents"],["con","Condiments & épices"],["fru","Fruits"],["aut","Autres"]];
/* frac/qLabel/computeCourses : voir logic.js. Wrapper local pour l'app : */
function coursesFor(wid){ return computeCourses(MENUS[wid], wid, deleted, RAYONS, function(di,ri){ return couvertsGet(wid,di,ri); }); }

/* Quantités "à acheter" ajustées (j'ai déjà X, je n'achète que Y), par semaine.
   Réinitialisées à la régénération de la semaine (empreinte du brut, comme les overrides). */
function qtyKey(wid){ return 'owq.qty.'+wid; }
function loadQty(wid){ const raw=store.get(qtyKey(wid)); if(!raw) return {};
  let o; try{ o=JSON.parse(raw); }catch(e){ return {}; }
  if(!o || o.base!==weekFp(RAW_MENUS[wid])) return {};   // semaine régénérée (genId changé) -> reset
  return o.q||{}; }
function saveQty(wid,q){ store.set(qtyKey(wid), JSON.stringify({base:weekFp(RAW_MENUS[wid]), q:q})); }
function qtyGet(wid,ck,need){ const q=loadQty(wid); return (ck in q)?q[ck]:need; }
function qtySet(wid,ck,val,need){ const q=loadQty(wid); if(val==null||val===need) delete q[ck]; else q[ck]=val; saveQty(wid,q); }

/* ============================ Rendu planning ============================ */
const planning=document.getElementById('planning');
const overlay=document.getElementById('overlay');
const ovBody=overlay.querySelector('.ov-body');
const ovTitle=overlay.querySelector('.ov-title');
const COURSES_SVG='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.3a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L20 7H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>';
const PREPARE_SVG='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
const COOK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-4Z"/><path d="M2 10h20"/><path d="M9.5 6.5c0-1 1-1 1-2M14.5 6.5c0-1 1-1 1-2"/></svg>';
const REROLL_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>';
const GRIP_SVG='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>';

function nutriMeta(r){ const m=[];
  if(typeof r.kcal==='number') m.push('~'+r.kcal+' kcal');
  if(typeof r.prot==='number') m.push(r.prot+' g prot');
  return m; }
function repasRow(wid,di,ri,r){
  const key=wid+':'+di+'-'+ri, del=deleted.has(key), cv=couvertsGet(wid,di,ri);
  const meta=nutriMeta(r); if(cv>1) meta.push(cv+' couverts');
  return '<div class="repas-row '+(r.moment==='Soir'?'soir':'midi')+(del?' supprime':'')+'" data-key="'+key+'">'
    +'<button class="repas-grip" aria-label="Déplacer ce repas" title="Déplacer">'+GRIP_SVG+'</button>'
    +'<span class="repas-main repas-row-moment">'+r.moment+'</span>'
    +'<span class="repas-main"><span class="repas-row-titre">'+r.titre+'</span>'
    +'<span class="repas-row-meta">'+meta.join(' · ')+(r.priorite?'<span class="frais-pill">frais</span>':'')+'</span></span>'
    +'<button class="row-action" data-action="toggle" aria-label="'+(del?'Rétablir':'Supprimer')+' ce repas">'+(del?'↩':'✕')+'</button>'
    +'</div>';
}
function dayTotal(kc,pr){ const parts=[];
  if(kc>0) parts.push('~'+Math.round(kc)+' kcal');
  if(pr>0) parts.push(Math.round(pr)+' g protéines');
  return parts.length ? '<div class="day-total">Total du jour '+parts.join(' · ')+'</div>' : ''; }
/* Créneau vide (menu au fil de l'eau) : bouton « Définir ce repas » (non affiché sur les jours passés). */
function emptySlotRow(wid,di,ri){
  return '<div class="repas-row slot '+(ri===0?'midi':'soir')+'" data-slot="'+wid+':'+di+'-'+ri+'">'
    +'<span></span><span class="repas-row-moment">'+(ri===0?'Midi':'Soir')+'</span>'
    +'<span class="repas-main"><span class="slot-empty">+ Définir ce repas</span></span><span></span></div>';
}
function dayCard(d){
  const ws=sow(d), wid=idOf(ws), menu=MENUS[wid];
  const di=Math.round((d-ws)/86400000);
  const past=d<today, isToday=(+d===+today);
  let h='<div class="day-card'+(past?' passe':'')+(isToday?' today':'')+'" id="day-'+idOf(d)+'">';
  h+='<div class="day-h">'+JOURS[d.getDay()]+' '+fmt(d)+'</div>';
  let kc=0,pr=0,n=0;
  for(let ri=0; ri<2; ri++){
    const r=menu && menu.jours[di] && menu.jours[di].repas[ri];
    if(r && !r.vide){ h+=repasRow(wid,di,ri,r);
      if(!deleted.has(wid+':'+di+'-'+ri)){ if(typeof r.kcal==='number')kc+=r.kcal; if(typeof r.prot==='number')pr+=r.prot; n++; } }
    else if(!past){ h+=emptySlotRow(wid,di,ri); }
  }
  if(n) h+=dayTotal(kc,pr);
  else if(past) h+='<div class="repas-vide">—</div>';
  h+='</div>'; return h;
}
function renderDay(d){
  let h='';
  if(+d===+sow(d)){                                                            // premier jour de la semaine alimentaire : entête + actions
    const wid=idOf(d);
    h+='<div class="week-marker"><span class="wm-name">Semaine du '+fmt(d)+'</span>'
      +'<span class="wm-actions">'
      +'<button class="prep-btn" data-prepare="'+wid+'">'+PREPARE_SVG+'Générer</button>'
      +'<button class="courses-btn" data-courses="'+wid+'">'+COURSES_SVG+'Courses</button>'
      +'</span></div>';
  }
  h+=dayCard(d); return h;
}

let cursor=sow(today), daysRendered=0;
const MAX_DAYS=30*7;
function appendDays(n){ let h=''; for(let i=0;i<n && daysRendered<MAX_DAYS;i++){ h+=renderDay(cursor); cursor=addDays(cursor,1); daysRendered++; } planning.insertAdjacentHTML('beforeend',h); }

/* Migration du stockage : les ids sont passés des UUID (ancien backend) aux slugs -> les anciennes réfs
   ne résolvent plus. On purge le cache dépendant des ids (recettes/menus/historique/overrides/quantités) ;
   profil, panier, couverts et repas exclus (clés wid:di-ri) sont conservés. */
const STORE_VERSION='2';
function migrateStore(){
  if(store.get('owq.storev')===STORE_VERSION) return;
  ['owq.recipes','owq.gen','owq.history','owq.menu'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  try{ Object.keys(localStorage).filter(function(k){ return k.indexOf('owq.qty.')===0; }).forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
  store.set('owq.storev', STORE_VERSION);
}
function boot(){
  migrateStore();
  rebuild();
  appendDays(21);
  const el = document.getElementById('day-'+idOf(today));
  if(el) el.scrollIntoView({block:'start'});
}
boot();

let loading=false;
window.addEventListener('scroll',function(){
  if(window.innerHeight+window.scrollY < document.body.offsetHeight-800) return;
  if(currentView==='catalogue'){ if(catShown<catFiltered.length) appendCatalogue(); return; }
  if(loading||daysRendered>=MAX_DAYS) return;
  loading=true; appendDays(7); setTimeout(function(){loading=false;},60);
});

/* ============================ Statut ============================ */
function setStatus(msg,ok){ const s=document.getElementById('owq-status'); if(!s) return; s.textContent=msg; s.className=ok?'ok':''; s.hidden=false; }
function clearStatus(){ const s=document.getElementById('owq-status'); if(s) s.hidden=true; }
function rerenderPlanning(){ const cards=planning.querySelectorAll('.day-card');
  cards.forEach(function(c){ refreshDay(parseId(c.id.replace('day-',''))); }); }

/* ============================ Suppression de repas ============================ */
function updateRow(row,del){
  row.classList.toggle('supprime',del);
  const b=row.querySelector('.row-action');
  b.textContent=del?'↩':'✕'; b.setAttribute('aria-label',(del?'Rétablir':'Supprimer')+' ce repas');
}
function setDeleted(key,del){
  if(del) deleted.add(key); else deleted.delete(key);
  saveSet('owq.deleted',deleted);
  const row=planning.querySelector('.repas-row[data-key="'+key+'"]');
  if(row) updateRow(row,del);
  // si la liste de courses de cette semaine est ouverte (desktop deux-volets), la rafraîchir
  if(!overlay.hidden && ovBody.querySelector('.rayon') && ovBody.dataset.cwid) rerenderCourses(ovBody.dataset.cwid);
}

/* ============================ Mode cuisine (wake lock) ============================ */
let wakeLock=null, cookMode=false;
async function acquireWake(){ if(!('wakeLock' in navigator)) return; try{ wakeLock=await navigator.wakeLock.request('screen'); }catch(e){ wakeLock=null; } }
function releaseWake(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; } }
async function setCookMode(on){ cookMode=on; if(on) await acquireWake(); else releaseWake();
  const b=ovBody.querySelector('[data-cook]'); if(b){ b.setAttribute('aria-pressed',on?'true':'false'); b.classList.toggle('is-on',on); } }
/* Le système relâche le wake lock quand l'onglet passe en arrière-plan : le ré-acquérir au retour si le mode est actif. */
document.addEventListener('visibilitychange',function(){ if(!document.hidden && cookMode && !wakeLock) acquireWake(); });

/* ============================ Overlays ============================ */
/* Desktop (>=900px) : le détail s'affiche dans un panneau ancré à droite (deux volets),
   sans verrou de scroll ni empilement d'historique ; « fermer » = revenir au placeholder.
   Le planning reste dans le flux (scroll fenêtre) pour préserver le scroll infini. */
const mqDesktop=window.matchMedia('(min-width:900px)');
function isDesktop(){ return mqDesktop.matches; }
function setHeadH(){ const hh=document.querySelector('.app-header'); if(hh) document.documentElement.style.setProperty('--head-h',hh.offsetHeight+'px'); }
function showPlaceholder(){ if(cookMode) setCookMode(false); ovTitle.textContent='';
  ovBody.innerHTML='<p class="ov-placeholder">Sélectionne un repas pour voir la recette, ou « Courses » pour la liste.</p>';
  overlay.hidden=false; }
function openOverlay(){ overlay.hidden=false; ovBody.scrollTop=0;
  if(!isDesktop()){ document.body.style.overflow='hidden'; overlayOpen=true; history.pushState({owq:'overlay'},''); } }
function closeOverlay(){ if(cookMode) setCookMode(false);
  if(isDesktop()){ showPlaceholder(); return; }
  overlay.hidden=true; document.body.style.overflow=''; overlayOpen=false; }
overlay.querySelector('.ov-back').addEventListener('click',function(){ if(isDesktop()) closeOverlay(); else history.back(); });

/* ===== Navigation 2 vues (catalogue par défaut, menu secondaire) + historique =====
   base = catalogue ; ouvrir le menu pousse un état ; ouvrir un overlay (mobile) en pousse un autre.
   Le retour Android dépile overlay -> menu -> catalogue (popstate reflète l'état courant). */
const catalogue=document.getElementById('catalogue');
const fab=document.getElementById('today-fab');
let currentView='catalogue', overlayOpen=false;
history.replaceState({owq:'base'},'');
const navBackdrop=document.getElementById('nav-backdrop');
function openNav(){ setHeadH(); document.querySelector('.app-header').classList.add('nav-open'); if(navBackdrop) navBackdrop.hidden=false; }
function closeNav(){ const hh=document.querySelector('.app-header'); if(hh) hh.classList.remove('nav-open'); if(navBackdrop) navBackdrop.hidden=true; setHeadH(); }
function applyView(){
  catalogue.hidden=currentView!=='catalogue';
  planning.hidden=currentView!=='planning';
  if(fab) fab.style.display=currentView==='planning'?'':'none';
  document.querySelectorAll('.nav-link').forEach(function(b){ b.classList.toggle('is-active', b.dataset.view===currentView); });
  if(isDesktop()) showPlaceholder();               // repartir du placeholder à la bascule (panneau droit)
  if(currentView==='catalogue') ensureCatalogue();
}
function setView(v){ if(v===currentView) return; currentView=v; applyView(); }
function goView(v){
  closeNav();
  if(v===currentView) return;
  if(!isDesktop() && overlayOpen){ history.back(); return; }   // referme d'abord un overlay
  if(v==='planning'){ setView('planning'); history.pushState({owq:'planning'},''); }
  else { if(history.state && history.state.owq==='planning') history.back(); else setView('catalogue'); }
}
window.addEventListener('popstate',function(e){
  if(!isDesktop() && overlayOpen && !overlay.hidden){ closeOverlay(); return; }
  setView((e.state && e.state.owq==='planning') ? 'planning' : 'catalogue');
});
/* Init + bascule de breakpoint */
setHeadH();
window.addEventListener('resize',setHeadH);
mqDesktop.addEventListener('change',function(e){
  if(e.matches){ document.body.style.overflow=''; setHeadH(); if(overlay.hidden) showPlaceholder(); }
  else { if(overlay.querySelector('.ov-placeholder')){ overlay.hidden=true; } }
});
if(isDesktop()) showPlaceholder();

/* Cœur de rendu d'une recette (réutilisé par le menu ET la consultation du catalogue).
   opts : {moment?, cv?, couvertsKey?, delKey?, cook?, allergenes?}. Sans couvertsKey/delKey/cook,
   c'est la vue consultation (pas de contrôle couverts, pas de mode cuisine, pas de retrait). */
function renderRecipeCard(r, opts){
  opts=opts||{}; const cv=opts.cv||1, sc=(opts.moment==='Soir');
  let h='<article class="recipe'+(sc?' soir':'')+'">';
  if(opts.moment) h+='<span class="recipe-tag'+(sc?' soir':'')+'">'+opts.moment+'</span>';
  h+='<h2 class="recipe-titre">'+r.titre+'</h2>';
  if(r.image) h+='<img class="recipe-img" src="'+r.image+'" alt="" loading="lazy">';
  let macros='';
  if(typeof r.kcal==='number') macros+='<span class="chip kcal">~'+r.kcal+' kcal</span>';
  if(typeof r.prot==='number') macros+='<span class="chip prot">~'+r.prot+' g prot</span>';
  if(r.priorite) macros+='<span class="chip frais">Légumes frais</span>';
  if(macros) h+='<div class="macros">'+macros+'</div>';
  if(opts.allergenes && r.allergenes && r.allergenes.length)
    h+='<p class="allerg">Allergènes : '+r.allergenes.map(function(a){return a.replace(/-/g,' ');}).join(', ')+'</p>';
  if(opts.couvertsKey){
    h+='<div class="couverts" data-cvkey="'+opts.couvertsKey+'"><span class="cv-label">Couverts</span>'
      +'<button class="cv-btn" data-cv="-" aria-label="Moins de couverts">-</button>'
      +'<span class="cv-val">'+cv+'</span>'
      +'<button class="cv-btn" data-cv="+" aria-label="Plus de couverts">+</button>'
      +'<span class="cv-hint">ajuste les quantités (recette et courses)</span></div>';
  }
  if(opts.cook && 'wakeLock' in navigator)
    h+='<div class="recipe-actions"><button class="act-btn'+(cookMode?' is-on':'')+'" data-cook aria-pressed="'+(cookMode?'true':'false')+'" aria-label="Mode cuisine (garder l’écran allumé)" title="Mode cuisine">'+COOK_SVG+'</button></div>';
  h+='<div class="bloc"><h3>Ingrédients</h3><ul class="ingr">'+r.ingredients.map(function(i){return '<li>'+scaleIngredientLine(i,cv)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="bloc"><h3>Préparation</h3><ol class="etapes">'+r.etapes.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol></div>';
  if(opts.delKey){ const del=deleted.has(opts.delKey);
    h+='<button class="del-btn'+(del?' is-del':'')+'" data-delkey="'+opts.delKey+'">'+(del?'↩ Rétablir ce repas':'✕ Je mange à l’extérieur — retirer ce repas')+'</button>'; }
  h+='</article>';
  return h;
}
/* Vue recette depuis un créneau de menu (moment, couverts, mode cuisine, retrait). */
function renderRecipe(key){
  const p=key.split(':'), wid=p[0], idx=p[1].split('-'), di=+idx[0], ri=+idx[1];
  const r=MENUS[wid].jours[di].repas[ri], cv=couvertsGet(wid,di,ri);
  ovTitle.textContent=r.moment;
  ovBody.innerHTML=renderRecipeCard(r,{moment:r.moment, cv:cv, couvertsKey:key, delKey:key, cook:true});
  ovBody.dataset.cwid='';
}
function openRecipe(key){
  if(cookMode){ cookMode=false; releaseWake(); }   // nouvelle recette : repartir écran non verrouillé
  renderRecipe(key); openOverlay();
}
/* Vue recette depuis le catalogue (consultation : pas de couverts/cuisine/retrait). */
function openCatalogueRecipe(id){
  catGetRecipe(id).then(catMapRecipe).then(function(r){
    ovTitle.textContent=r.titre;
    ovBody.innerHTML=renderRecipeCard(r,{cv:1, allergenes:true});
    ovBody.dataset.cwid='';
    openOverlay();
  }).catch(function(){ setStatus('Recette indisponible',false); setTimeout(clearStatus,2500); });
}

/* ============================ Catalogue (écran principal, paginé + filtrable) ============================ */
let catIndex=null;                 // { version, recipes:[...] }
let catAll=[], catFiltered=[], catShown=0;
const CAT_PAGE=20;
const CAT_TYPES=[['','Tous les types'],['repas','Repas'],['base','Bases'],['accompagnement','Accompagnements'],['dessert','Desserts']];
function loadIndex(opts){ return fetch('recipes/index.json',opts).then(function(r){ if(!r.ok) throw new Error('index'); return r.json(); }); }
function ensureCatalogue(){
  if(catIndex) return;
  loadIndex().then(function(idx){
    catIndex=idx; catAll=idx.recipes||[];
    if(!store.get('owq.catalogue.version')) store.set('owq.catalogue.version', idx.version||'');
    renderCatalogueUI();
  }).catch(function(){ catalogue.innerHTML='<p class="cat-empty">Catalogue indisponible hors-ligne pour l’instant. Reconnecte-toi une fois pour le télécharger.</p>'; });
}
let catExcl=new Set();   // allergènes à exclure (multi-sélection, persistée entre rendus)
function catFiltersState(){
  return {
    types: (document.getElementById('cat-type')||{}).value ? [document.getElementById('cat-type').value] : [],
    diets: (document.getElementById('cat-diet')||{}).value ? [document.getElementById('cat-diet').value] : [],
    excludeAllergenes: Array.from(catExcl),
    query: (document.getElementById('cat-search')||{}).value || ''
  };
}
function catCard(r){
  const type=(r.labels||[]).map(norm).find(function(t){ return ['repas','base','accompagnement','dessert'].indexOf(t)!==-1; })||'';
  const alg=(r.allergenes&&r.allergenes.length)?('Allergènes : '+r.allergenes.map(function(a){ return a.replace(/-/g,' '); }).join(', ')):'';
  return '<div class="cat-card" data-id="'+r.id+'"><div class="cat-body">'
    +'<div class="cat-titre">'+r.titre+'</div>'
    +'<div class="cat-meta">'+(type?'<span class="cat-tag t-'+type+'">'+type+'</span>':'')+alg+'</div>'
    +'</div></div>';
}
function algSummary(){ const s=catalogue.querySelector('.cat-allerg>summary'); if(s) s.textContent='Allergènes'+(catExcl.size?' ('+catExcl.size+')':''); }
function renderCatalogueUI(){
  const opt=function(a){ return '<option value="'+a[0]+'">'+a[1]+'</option>'; };
  const diets=[['','Tous régimes']].concat(DIETS.filter(function(d){ return d[0]; }));
  let h='<div class="cat-filters">'
    +'<div class="cat-search-wrap"><input id="cat-search" type="search" placeholder="Rechercher (titre, ingrédient)…">'
      +'<button type="button" id="cat-clear" aria-label="Effacer la recherche" hidden>&times;</button></div>'
    +'<div class="cat-row">'
      +'<select id="cat-type">'+CAT_TYPES.map(opt).join('')+'</select>'
      +'<select id="cat-diet">'+diets.map(opt).join('')+'</select>'
      +'<details class="cat-allerg"><summary>Allergènes</summary><div class="opts">'
        +ALLERGENES.map(function(a){ return '<button type="button" class="alg-chip'+(catExcl.has(a)?' on':'')+'" data-a="'+a+'">'+a.replace(/-/g,' ')+'</button>'; }).join('')
      +'</div></details>'
    +'</div></div>'
    +'<p class="cat-count" id="cat-count"></p><div id="cat-list"></div>';
  catalogue.innerHTML=h;
  algSummary();
  renderCatalogue();
}
function renderCatalogue(){
  catFiltered=catalogueFilter(catAll, catFiltersState()); catShown=0;
  const c=document.getElementById('cat-count'); if(c) c.textContent=catFiltered.length+' recette'+(catFiltered.length>1?'s':'');
  const list=document.getElementById('cat-list'); if(list) list.innerHTML='';
  appendCatalogue();
}
function appendCatalogue(){
  const list=document.getElementById('cat-list'); if(!list) return;
  if(!catFiltered.length){ list.innerHTML='<p class="cat-empty">Aucune recette ne correspond.</p>'; return; }
  const slice=catFiltered.slice(catShown, catShown+CAT_PAGE);
  list.insertAdjacentHTML('beforeend', slice.map(catCard).join(''));
  catShown+=slice.length;
}
catalogue.addEventListener('input',function(e){ if(e.target.closest('#cat-search')){ const cl=document.getElementById('cat-clear'); if(cl) cl.hidden=!e.target.value; renderCatalogue(); } });
catalogue.addEventListener('change',function(e){ if(e.target.closest('#cat-type,#cat-diet')) renderCatalogue(); });
catalogue.addEventListener('click',function(e){
  const chip=e.target.closest('.alg-chip');
  if(chip){ const a=chip.dataset.a; if(catExcl.has(a)) catExcl.delete(a); else catExcl.add(a); chip.classList.toggle('on'); algSummary(); renderCatalogue(); return; }
  const clr=e.target.closest('#cat-clear');
  if(clr){ const s=document.getElementById('cat-search'); if(s){ s.value=''; s.focus(); } clr.hidden=true; renderCatalogue(); return; }
  const c=e.target.closest('.cat-card'); if(c) openCatalogueRecipe(c.dataset.id);
});

/* Navigation : hamburger (mobile) + boutons Catalogue/Menu ; Réglages/IA ferment le menu. */
document.getElementById('owq-hamburger').addEventListener('click',function(){
  if(document.querySelector('.app-header').classList.contains('nav-open')) closeNav(); else openNav();
});
if(navBackdrop) navBackdrop.addEventListener('click', closeNav);
document.getElementById('owq-nav').addEventListener('click',function(e){
  const b=e.target.closest('.nav-link'); if(b){ goView(b.dataset.view); return; }
  if(e.target.closest('#owq-settings,#owq-ia')) closeNav();
});

/* ===== Détection de mise à jour du catalogue (en ligne) : bannière + téléchargement delta ===== */
function checkCatalogueUpdate(){
  if(!navigator.onLine) return;
  loadIndex({cache:'no-store'}).then(function(idx){
    const seen=store.get('owq.catalogue.version');
    if(!seen){ store.set('owq.catalogue.version', idx.version||''); return; }
    if(idx.version && idx.version!==seen){
      const s=document.getElementById('owq-status');
      setStatus('Nouvelles recettes disponibles — toucher pour mettre à jour', true);
      s.style.cursor='pointer'; s.onclick=function(){ applyCatalogueUpdate(idx); };
    }
  }).catch(function(){});
}
function applyCatalogueUpdate(newIdx){
  const s=document.getElementById('owq-status'); s.onclick=null; s.style.cursor='';
  const d=diffCatalogue(catIndex||{recipes:catAll}, newIdx);
  d.added.concat(d.changed).forEach(function(id){ fetch('recipes/'+id+'.json').catch(function(){}); });  // le SW (network-first) met en cache
  catIndex=newIdx; catAll=newIdx.recipes||[];
  store.set('owq.catalogue.version', newIdx.version||'');
  genPoolCache=null;                                    // le pool de génération a pu changer
  if(currentView==='catalogue' && document.getElementById('cat-list')) renderCatalogue();
  setStatus('Catalogue à jour ✓', true); setTimeout(clearStatus, 2500);
}
window.addEventListener('online', checkCatalogueUpdate);
/* Construit le HTML de la liste de courses (quantités ajustables, cf. qtyGet/qtySet). */
function coursesInner(wid){
  const data=coursesFor(wid);
  if(!data) return null;
  let h='<p class="hint">Liste calculée à partir des repas conservés. Ajuste une quantité si tu en as déjà : touche le nombre.</p>';
  data.forEach(function(ray){
    h+='<section class="rayon r-'+ray.cls+'"><h2><span class="pip"></span>'+ray.rayon+'</h2><ul>';
    ray.items.forEach(function(it){
      const ck=wid+'§'+ray.cls+'§'+it.n;
      let qHtml='';
      if(it.exclu){                                                  // repas exclu -> grisé, quantité (retirée) affichée, non éditable
        qHtml='<span class="course-q">'+(it.disp||'')+'</span>';
      } else if(typeof it.q==='number'){                             // quantité numérique -> ajustable
        const buy=qtyGet(wid,ck,it.q);
        qHtml='<button class="course-q edit" data-qedit="1" data-ck="'+ck+'" data-wid="'+wid+'" data-need="'+it.q+'" data-u="'+(it.u||'')+'" data-buy="'+buy+'">'
          +qLabel({q:buy,u:it.u,note:it.note})
          +(buy!==it.q?'<span class="q-need">sur '+qLabel({q:it.q,u:it.u})+'</span>':'')
          +'</button>';
      } else if(it.disp){ qHtml='<span class="course-q">'+it.disp+'</span>'; }
      h+= it.exclu
        ? '<li class="course-item exclu"><span class="check"></span><span class="course-nom">'+it.n+'</span>'+qHtml+'</li>'
        : '<li class="course-item'+(coches.has(ck)?' done':'')+'" data-ck="'+ck+'"><span class="check">'+CHECK+'</span>'
          +'<span class="course-nom">'+it.n+'</span>'+qHtml+'</li>';
    });
    h+='</ul></section>';
  });
  return h;
}
function openCourses(wid){
  ovTitle.textContent='Courses · sem. du '+fmt(parseId(wid));
  const h=coursesInner(wid);
  ovBody.innerHTML = h===null ? '<p class="hint">Liste à définir une fois le menu de cette semaine choisi.</p>' : h;
  ovBody.dataset.cwid=wid;
  openOverlay();
}
/* Re-rendu sans réinitialiser le scroll (après ajustement d'une quantité / exclusion d'un repas). */
function rerenderCourses(wid){ const top=ovBody.scrollTop; const h=coursesInner(wid); if(h!=null){ ovBody.innerHTML=h; ovBody.dataset.cwid=wid; ovBody.scrollTop=top; } }
function startQtyEdit(btn){
  const ck=btn.dataset.ck, wid=btn.dataset.wid, need=+btn.dataset.need, u=btn.dataset.u, buy=+btn.dataset.buy;
  const wrap=document.createElement('span'); wrap.className='q-edit';
  const inp=document.createElement('input'); inp.type='number'; inp.min='0'; inp.step='any'; inp.inputMode='decimal'; inp.value=buy;
  wrap.appendChild(inp); if(u){ const us=document.createElement('span'); us.className='q-unit'; us.textContent=u; wrap.appendChild(us); }
  btn.replaceWith(wrap); inp.focus(); inp.select();
  let done=false;
  function commit(){ if(done) return; done=true; let v=parseFloat(inp.value); if(isNaN(v)||v<0) v=need; qtySet(wid,ck,v,need); rerenderCourses(wid); }
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
  inp.addEventListener('blur',commit);
}


/* ============================ Génération de menus (logiciel, catalogue local) ============================ */
let genState=null;        // proposition en cours : { wid, tokens, pool:[recettes mappées], menu, used:Set }
let genPoolCache=null;    // cache session du pool (évite un refetch entre régénérations)

function genHistory(){ const raw=store.get('owq.history'); let a=[]; if(raw){ try{ a=JSON.parse(raw)||[]; }catch(e){} } return new Set(a); }
function pushHistory(ids){ const raw=store.get('owq.history'); let a=[]; if(raw){ try{ a=JSON.parse(raw)||[]; }catch(e){} }
  a=ids.concat(a.filter(function(x){ return ids.indexOf(x)===-1; })).slice(0,40); store.set('owq.history', JSON.stringify(a)); }
function usedIdsOf(menu){ const s=new Set(); menu.jours.forEach(function(d){ d.repas.forEach(function(r){ s.add(r.recipe); }); }); return s; }
function recipeById(id){ return genState&&genState.pool ? genState.pool.find(function(r){ return r.id===id; }) : null; }
function setGenMsg(t){ const el=document.getElementById('gen-msg'); if(el) el.textContent=t||''; }

function openGenerate(wid){
  ovTitle.textContent='Générer le menu';
  const saved=store.get('owq.panier.'+wid)||'';
  let h='<p class="prep-note">Semaine du <span class="prep-week">'+fmt(parseId(wid))+'</span>. '
    +'Indique ce que tu as déjà (panier, placard) : le menu privilégiera les recettes qui les utilisent.</p>';
  h+='<div class="field"><label>Ingrédients disponibles</label>'
    +'<textarea id="owq-panier" placeholder="ex. 1 courgette; 3 tomates; 200 g de lentilles">'+saved.replace(/</g,'&lt;')+'</textarea></div>';
  h+='<button class="btn-primary" id="gen-go" data-wid="'+wid+'">Générer le menu</button>';
  h+='<div class="prep-ok" id="gen-msg"></div>';
  ovBody.innerHTML=h; openOverlay();
}

/* ===== Définir un repas à l'unité (créneau vide -> génération d'1 recette) ===== */
let slotState=null;   // { wid, di, ri, tokens, pool, id }
function usedIdsOfWeek(wid){ const s=new Set(); const wk=loadGenMenus()[wid];
  if(wk&&wk.jours) wk.jours.forEach(function(day){ (day.repas||[]).forEach(function(ref){ if(ref&&ref.recipe) s.add(ref.recipe); }); }); return s; }
function openGenerateSlot(wid,di,ri){
  slotState=null;
  ovTitle.textContent='Définir '+(ri===0?'le midi':'le soir');
  const saved=store.get('owq.panier.'+wid)||'', jour=JOURS[addDays(parseId(wid),di).getDay()];
  let h='<p class="prep-note">'+jour+' '+(ri===0?'midi':'soir')+' (semaine du <span class="prep-week">'+fmt(parseId(wid))+'</span>). '
    +'Indique ce que tu as : une recette te sera proposée.</p>';
  h+='<div class="field"><label>Ingrédients disponibles</label>'
    +'<textarea id="owq-panier" placeholder="ex. 1 courgette; 3 tomates">'+saved.replace(/</g,'&lt;')+'</textarea></div>';
  h+='<button class="btn-primary" id="slot-go" data-k="'+wid+':'+di+'-'+ri+'">Proposer une recette</button>';
  h+='<div class="prep-ok" id="gen-msg"></div>';
  ovBody.innerHTML=h; ovBody.dataset.cwid=''; openOverlay();
}
function runGenerateSlot(wid,di,ri){
  const ta=document.getElementById('owq-panier'), stock=ta?ta.value:''; store.set('owq.panier.'+wid,stock);
  const btn=document.getElementById('slot-go'); if(btn) btn.disabled=true; setGenMsg('Recherche…');
  loadPool().then(function(pool){
    if(!pool.length){ setGenMsg('Aucune recette exploitable dans le catalogue.'); if(btn) btn.disabled=false; return; }
    const tokens=tokenize(stock), id=pickSlotRecipe(pool, tokens, usedIdsOfWeek(wid), {rng:Math.random});
    slotState={ wid:wid, di:di, ri:ri, tokens:tokens, pool:pool, id:id };
    renderSlotProposal();
  }).catch(function(e){ setGenMsg('Erreur : '+e.message); if(btn) btn.disabled=false; });
}
function renderSlotProposal(){
  const r=slotState.pool.find(function(x){ return x.id===slotState.id; }), s=(slotState.ri!==0);
  let h='<p class="prep-note">Proposition pour '+(s?'le soir':'le midi')+'. Remplace si besoin, puis ajoute.</p>';
  h+='<div class="gen-day"><div class="gen-repas'+(s?' soir':'')+'">'
    +'<span class="gen-moment '+(s?'soir':'midi')+'">'+(s?'Soir':'Midi')+'</span>'
    +'<span class="gen-titre">'+(r?r.titre:slotState.id)+'</span>'
    +'<button class="gen-reroll" id="slot-reroll" aria-label="Proposer une autre">'+REROLL_SVG+'</button></div></div>';
  h+='<button class="btn-primary" id="slot-validate">Ajouter au menu</button>';
  h+='<button class="btn-secondary" id="slot-back">Changer les ingrédients</button>';
  ovBody.innerHTML=h;
}
function rerollSlotGen(){ if(!slotState) return; const ex=usedIdsOfWeek(slotState.wid); ex.add(slotState.id);
  const alt=pickSlotRecipe(slotState.pool, slotState.tokens, ex, {rng:Math.random}); if(alt) slotState.id=alt; renderSlotProposal(); }
function validateSlot(){
  if(!slotState) return; const wid=slotState.wid, di=slotState.di, ri=slotState.ri, id=slotState.id;
  const r=slotState.pool.find(function(x){ return x.id===id; });
  const gen=loadGenMenus(); let wk=gen[wid];
  if(!wk||!wk.jours){ wk={ genId:newGenId(), jours:[] }; }        // squelette 7 jours x 2 créneaux
  if(!wk.genId) wk.genId=newGenId();
  while(wk.jours.length<7) wk.jours.push({repas:[null,null]});
  wk.jours.forEach(function(day){ if(!day.repas) day.repas=[null,null]; while(day.repas.length<2) day.repas.push(null); });
  wk.jours[di].repas[ri]={recipe:id};
  gen[wid]=wk; saveGenMenus(gen);
  const cache=loadRecipesCache(); if(r) cache[id]=r; saveRecipesCache(cache);
  rebuild(); refreshDay(addDays(parseId(wid),di)); slotState=null; closeOverlay();
  setStatus('Repas ajouté ✓', true); setTimeout(clearStatus, 2500);
}
/* Pool = recettes étiquetées "repas" du catalogue owner (base/accompagnement/dessert/non étiqueté exclus),
   détaillées puis mappées. Filtre régime souple. */
function loadPool(){
  if(genPoolCache && genPoolCache.length) return Promise.resolve(genPoolCache);   // ne pas re-servir un pool vide (échec réseau)
  function labelIs(r, val){ return (r.labels||[]).some(function(t){ return norm(t)===val; }); }
  return catGetRecipes().then(function(lite){
    let mains=lite.filter(function(r){ return labelIs(r,'repas'); });
    if(profile.diet){ const d=mains.filter(function(r){ return labelIs(r, profile.diet); });
      if(d.length>=4) mains=d; }                          // filtre régime souple (évite un pool vide)
    return Promise.all(mains.map(function(r){ return catGetRecipe(r.id).then(catMapRecipe).catch(function(){ return null; }); }));
  }).then(function(details){ const pool=details.filter(Boolean); if(pool.length) genPoolCache=pool; return pool; });
}
function runGenerate(wid){
  const ta=document.getElementById('owq-panier'), stock=ta?ta.value:''; store.set('owq.panier.'+wid, stock);
  const btn=document.getElementById('gen-go'); if(btn) btn.disabled=true; setGenMsg('Recherche de recettes…');
  loadPool().then(function(pool){
    if(!pool.length){ setGenMsg('Aucune recette exploitable dans le catalogue.'); if(btn) btn.disabled=false; return; }
    const tokens=tokenize(stock), menu=generateMenu(pool, tokens, {history:genHistory(), rng:Math.random});
    genState={ wid:wid, tokens:tokens, pool:pool, menu:menu, deleted:new Set() };
    renderProposal();
  }).catch(function(e){ setGenMsg('Erreur : '+e.message); if(btn) btn.disabled=false; });
}
function renderProposal(){
  const wid=genState.wid, m=genState.menu;
  let h='<p class="prep-note">Menu proposé pour la semaine du <span class="prep-week">'+fmt(parseId(wid))+'</span>. '
    +'Ouvre une recette (lien), remplace un choix, puis valide.</p>';
  m.jours.forEach(function(day,di){ const d=addDays(parseId(wid),di);
    h+='<div class="gen-day"><div class="gen-day-h">'+JOURS[d.getDay()]+' '+fmt(d)+'</div>';
    if(!day.repas.length) h+='<div class="repas-vide">—</div>';
    day.repas.forEach(function(ref,ri){ const r=recipeById(ref.recipe); const gk=di+'-'+ri, del=genState.deleted.has(gk);
      h+='<div class="gen-repas'+(ri===0?'':' soir')+(del?' supprime':'')+'" data-gkey="'+gk+'">'
        +(del?'':'<button class="gen-handle" aria-label="Déplacer ce repas" title="Déplacer">'+GRIP_SVG+'</button>')
        +'<span class="gen-moment '+(ri===0?'midi':'soir')+'">'+(ri===0?'Midi':'Soir')+'</span>'
        +'<span class="gen-titre">'+(r?r.titre:ref.recipe)+'</span>';
      if(del){ h+='<button class="gen-del" data-gdel="'+gk+'" aria-label="Rétablir ce repas" title="Rétablir">↩</button>'; }
      else { h+='<button class="gen-reroll" data-reroll="'+gk+'" aria-label="Proposer une autre recette" title="Proposer une autre">'+REROLL_SVG+'</button>'
        +'<button class="gen-del" data-gdel="'+gk+'" aria-label="Supprimer ce repas" title="Supprimer">✕</button>'; }
      h+='</div>';
    });
    h+='</div>';
  });
  h+='<button class="btn-primary" id="gen-validate">Valider la semaine</button>';
  h+='<button class="btn-secondary" id="gen-back">Changer les ingrédients</button>';
  ovBody.innerHTML=h;
}
function rerollSlot(di,ri){
  if(!genState) return; const ref=genState.menu.jours[di].repas[ri]; if(!ref) return;
  const alt=pickAlternative(genState.pool, genState.tokens, usedIdsOf(genState.menu), {rng:Math.random});
  if(alt && alt!==ref.recipe){ ref.recipe=alt; renderProposal(); }
}
function validateGen(){
  if(!genState) return; const wid=genState.wid, menu=genState.menu, del=genState.deleted, used=usedIdsOf(menu);
  const cache=loadRecipesCache(); used.forEach(function(id){ const r=recipeById(id); if(r) cache[id]=r; }); saveRecipesCache(cache);
  const gen=loadGenMenus(); gen[wid]={genId:newGenId(), jours:menu.jours}; saveGenMenus(gen);   // génération pleine semaine -> nouveau genId (reset qty/overrides)
  Array.from(deleted).forEach(function(k){ if(k.indexOf(wid+':')===0) deleted.delete(k); });   // repart de la proposition
  const kept=[]; menu.jours.forEach(function(day,di){ day.repas.forEach(function(ref,ri){
    if(del.has(di+'-'+ri)) deleted.add(wid+':'+di+'-'+ri); else kept.push(ref.recipe); }); });
  saveSet('owq.deleted', deleted);
  pushHistory(Array.from(new Set(kept)));
  rebuild();
  deductStock(wid, store.get('owq.panier.'+wid)||'');       // pré-déduit le stock saisi de la liste de courses
  rerenderPlanning(); genState=null; closeOverlay();
  setStatus('Menu généré ✓', true); setTimeout(clearStatus, 3000);
}
/* Déduit le stock saisi des quantités à acheter (owq.qty), quand nom + unité concordent. */
function parseStock(str){ return splitItems(str).map(function(part){ const p=parseQty(part), cu=canonUnit(p.qty,p.unit);
    return { name:norm(p.name), qty:cu.qty, unit:cu.unit }; }).filter(function(x){ return x.name; }); }
function deductStock(wid, stockStr){
  const data=coursesFor(wid); if(!data) return; const stock=parseStock(stockStr); if(!stock.length) return;
  data.forEach(function(ray){ ray.items.forEach(function(it){
    if(it.exclu || typeof it.q!=='number') return; const nn=' '+norm(it.n)+' ';
    const s=stock.find(function(x){ return x.qty!=null && (x.unit||'')===(it.u||'') &&
      (nn.indexOf(' '+x.name+' ')!==-1 || (' '+x.name+' ').indexOf(nn)!==-1); });   // concordance par mot entier
    if(s) qtySet(wid, wid+'§'+ray.cls+'§'+it.n, Math.max(0, it.q - s.qty), it.q);
  }); });
}

/* ============================ Mode IA (caché : 7 touchers sur l'en-tête) ============================ */
/* Rédaction de recette assistée, sur le modèle du mode développeur Android. L'app construit le prompt
   (buildRecipePrompt) et ouvre Claude Code avec le dépôt lié ; la session cloud (git + proxy GitHub)
   rédige la recette et la publie en committant directement sur main (cf. skill /recipe). */
const IA_TAPS=7;
/* Deep link Android (ouvre l'app AVEC le dépôt ET le prompt) + repli web documenté (claude.ai/code)
   si le scheme claude:// n'est pas géré. */
const IA_REPO='vincentchalamon/obi-wan-quinoa';
const IA_LINK='claude://code/new?repo='+IA_REPO+'&q=';
const IA_LINK_WEB='https://claude.ai/code?repositories='+IA_REPO+'&prompt=';
let iaMode=store.get('owq.ia')==='1', iaTaps=0, iaLast=0, iaTimer=null;
/* Titres du catalogue local, embarqués dans le prompt pour l'anti-doublons (best-effort). */
let iaTitres=null;
function loadIaTitres(){
  if(iaTitres) return;
  catGetRecipes().then(function(lite){
    iaTitres=lite.map(function(r){ return r.titre; }).filter(Boolean).sort();
  }).catch(function(){});
}
/* Un seul timer : un setTimeout par toucher effacerait le message final. */
function iaToast(msg){ setStatus(msg,true); clearTimeout(iaTimer); iaTimer=setTimeout(clearStatus,2500); }
function renderIaBtn(){ document.getElementById('owq-ia').hidden=!iaMode; setHeadH(); }
/* Compteur à la Android : décompte affiché sur les 3 derniers, bascule au 7e, reset après 1,5 s d'inactivité. */
function tapBrand(){
  const now=Date.now(); if(now-iaLast>1500) iaTaps=0; iaLast=now; iaTaps++;
  const reste=IA_TAPS-iaTaps;
  if(reste>0){ if(reste<=3) iaToast('Plus que '+reste+' toucher'+(reste>1?'s':'')+'…'); return; }
  iaTaps=0; iaMode=!iaMode; store.set('owq.ia', iaMode?'1':'0'); renderIaBtn();
  iaToast(iaMode?'Mode IA activé ✓':'Mode IA désactivé');
  if(navigator.vibrate){ try{ navigator.vibrate(30); }catch(e){} }
}
function openRecipeAI(){
  ovTitle.textContent='Recette IA';
  loadIaTitres();   // en fond : prêts le temps que la demande soit saisie
  const saved=(store.get('owq.ia.demande')||'').replace(/</g,'&lt;');
  let h='<p class="prep-note">Décris ce que tu veux cuisiner : Claude rédige la recette et la publie dans le dépôt (commit sur <code>main</code>) après ta relecture.</p>';
  h+='<div class="field"><label>Ta demande</label>'
    +'<textarea id="owq-ia-demande" placeholder="ex. plat au potimarron et pois chiches, riche en protéines, sans gluten, 30 min">'+saved+'</textarea></div>';
  h+='<button class="btn-primary" id="ia-go">Générer une recette</button>';
  ovBody.innerHTML=h; openOverlay();
}
/* La demande est persistée avant de quitter la PWA : Android peut la recycler pendant la conversation.
   Tente le deep link claude:// ; si la page est toujours visible ~1,2 s après (scheme non géré),
   bascule sur le canal web documenté claude.ai/code. */
function sendRecipePrompt(){
  const ta=document.getElementById('owq-ia-demande'), d=ta?ta.value:'';
  store.set('owq.ia.demande', d);
  const q=encodeURIComponent(buildRecipePrompt(d,{mois:MOIS[new Date().getMonth()], diet:profile.diet, titres:iaTitres}));
  const t=setTimeout(function(){ if(!document.hidden) location.assign(IA_LINK_WEB+q); }, 1200);
  window.addEventListener('pagehide',function(){ clearTimeout(t); },{once:true});
  location.assign(IA_LINK+q);
}

function parseKey(k){ const p=k.split(':'), idx=p[1].split('-'); return {wid:p[0], di:+idx[0], ri:+idx[1]}; }
function swapDeleted(a,b){ const da=deleted.has(a), db=deleted.has(b);
  if(da!==db){ if(da){deleted.delete(a);deleted.add(b);} else {deleted.delete(b);deleted.add(a);} saveSet('owq.deleted',deleted); } }
function swapCouverts(a,b){ const ca=couvertsMap[a], cb=couvertsMap[b];   // suit les repas déplacés
  if(ca===cb) return;
  if(cb!==undefined) couvertsMap[a]=cb; else delete couvertsMap[a];
  if(ca!==undefined) couvertsMap[b]=ca; else delete couvertsMap[b];
  store.set('owq.couverts', JSON.stringify(couvertsMap)); }
function refreshDay(d){ const el=document.getElementById('day-'+idOf(d)); if(el){ const t=document.createElement('div'); t.innerHTML=dayCard(d); el.replaceWith(t.firstElementChild); } }
function doSwap(srcKey,tgtKey){
  const a=parseKey(srcKey), b=parseKey(tgtKey);
  if(a.wid!==b.wid) return;                        // échange au sein d'une même semaine
  const wid=a.wid, base=weekFp(RAW_MENUS[wid]);
  const ov=loadOverrides();
  const src=(ov[wid]&&ov[wid].base===base)?ov[wid].jours:(RAW_MENUS[wid]?RAW_MENUS[wid].jours:null);
  if(!src) return;
  const jours=JSON.parse(JSON.stringify(src));
  const t=jours[a.di].repas[a.ri]; jours[a.di].repas[a.ri]=jours[b.di].repas[b.ri]; jours[b.di].repas[b.ri]=t;
  ov[wid]={base:base, jours:jours}; saveOverrides(ov);
  swapDeleted(srcKey,tgtKey); swapCouverts(srcKey,tgtKey);
  MENUS=materializeMenus(applyOverrides(RAW_MENUS), R);
  refreshDay(addDays(parseId(wid),a.di)); if(b.di!==a.di) refreshDay(addDays(parseId(wid),b.di));
}

  if(!gdrag) return;
  const src=gdrag.key, t=genRowAt(e.clientX,e.clientY), tgt=(t&&t.dataset.gkey)||null;
  endGenDrag();
  if(tgt && tgt!==src) doSwapGen(src,tgt);
});
window.addEventListener('pointercancel',function(){ endGenDrag(); });

/* Service worker (HTTPS uniquement, ex. GitHub Pages) */
/* Vue par défaut = catalogue (écran principal) + détection d'une mise à jour du catalogue. */
applyView();
checkCatalogueUpdate();

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
